name: ECC PR Review Trio

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ecc-review-agent:
    name: ECC ${{ matrix.agent }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        agent:
          - silent-failure-hunter
          - pr-test-analyzer
          - type-design-analyzer

    steps:
      - name: Checkout trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0

      - name: Checkout pull request for analysis
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0

      - name: Fetch base commit into analysis checkout
        working-directory: pr
        run: |
          git remote add upstream "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags upstream "${{ github.event.pull_request.base.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run ECC review agent
        working-directory: pr
        run: >
          node ../base/scripts/ecc-pr-review-agent.mjs
          --agent "${{ matrix.agent }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --output "../ecc-${{ matrix.agent }}.md"

      - name: Comment ECC findings
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node base/scripts/ecc-pr-review-comment.mjs
          --agent "${{ matrix.agent }}"
          --body "ecc-${{ matrix.agent }}.md"

      - name: Upload ECC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-${{ matrix.agent }}-${{ github.event.pull_request.number }}
          path: ecc-${{ matrix.agent }}.md
          if-no-files-found: ignore
          retention-days: 14
